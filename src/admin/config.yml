# Decap CMS — production-конфиг для Netlify Identity + Git Gateway
# Документация: https://decapcms.org/docs/git-gateway-backend/
#
# Этот режим самый удобный для редактора:
#   - вход в /admin/ по email/паролю или invite-ссылке Netlify Identity
#   - без GitHub-токена в браузере
#   - коммиты в репозиторий делает Git Gateway
#
# Что нужно включить в Netlify:
#   1. Site configuration -> Identity -> Enable Identity
#   2. Identity -> Registration -> Invite only
#   3. Identity -> Services -> Enable Git Gateway

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'cms: create {{collection}} “{{slug}}”'
    update: 'cms: update {{collection}} “{{slug}}”'
    delete: 'cms: delete {{collection}} “{{slug}}”'
    uploadMedia: 'cms: upload media {{path}}'
    deleteMedia: 'cms: delete media {{path}}'
    openAuthoring: 'cms: {{message}}'

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

# Draft / Review / Publish — клиент правит → жмёт "Опубликовать" → только тогда
# изменения едут в main и Netlify их подхватывает. Без этого — коммит сразу в main.
publish_mode: editorial_workflow

# ───────────── Коллекции ─────────────

collections:

  # ── Настройки сайта (один файл) ──
  - name: "site"
    label: "Настройки сайта"
    label_singular: "Настройка"
    description: "Название бренда, контакты, соцсети, URL сайта"
    editor:
      preview: false
    files:
      - name: "site"
        label: "Общие настройки"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { label: "URL сайта", name: "url", widget: "string" }
          - { label: "Бренд", name: "brand", widget: "object", fields: [
              { label: "Полное название", name: "name", widget: "string" },
              { label: "Короткое название", name: "shortName", widget: "string" },
              { label: "Слоган", name: "tagline", widget: "string" },
              { label: "Описание", name: "description", widget: "text" },
            ]}
          - { label: "Автор", name: "author", widget: "object", fields: [
              { label: "Имя", name: "name", widget: "string" },
              { label: "Полное имя", name: "fullName", widget: "string" },
              { label: "Роль", name: "role", widget: "string" },
            ]}
          - { label: "Контакты", name: "contacts", widget: "object", fields: [
              { label: "Email", name: "email", widget: "string" },
              { label: "Телефон (отображение)", name: "phone", widget: "string" },
              { label: "Телефон (для tel:)", name: "phoneTel", widget: "string" },
              { label: "Telegram", name: "telegram", widget: "string" },
              { label: "Instagram", name: "instagram", widget: "string" },
              { label: "Локация (главный текст)", name: "location", widget: "string" },
              { label: "Локация (примечание)", name: "locationNote", widget: "text", required: false, hint: "Например: Практики и встречи — в Сухуме, также организуются выезды по России" },
            ]}
          - { label: "Соцсети", name: "social", widget: "object", fields: [
              { label: "Telegram", name: "telegram", widget: "string" },
              { label: "Instagram", name: "instagram", widget: "string" },
              { label: "YouTube", name: "youtube", widget: "string" },
            ]}

  # ── Блог: статьи (Markdown) ──
  - name: "posts"
    label: "Блог"
    label_singular: "Статья"
    description: "Статьи блога в формате Markdown. Каждая статья — отдельный файл."
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "src/assets/images/blog/{{slug}}"
    public_folder: "/assets/images/blog/{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "Только латиница и дефисы, например: my-article" }
      - { label: "Дата публикации", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Автор", name: "author", widget: "string", default: "MIA IRE" }
      - { label: "Время чтения", name: "readTime", widget: "string", hint: "Например: 8 минут", required: false }
      - { label: "Тег / Рубрика", name: "tag", widget: "string", required: false }
      - { label: "Обложка (файл)", name: "cover", widget: "image", allow_unsupported: false, required: false,
          media_library: { config: { multiple: false } } }
      - { label: "Alt обложки", name: "coverAlt", widget: "string", required: false }
      - { label: "Краткое описание (для ленты)", name: "excerpt", widget: "text", required: false }
      - { label: "Опубликовано", name: "draft", widget: "boolean", default: false, required: false, hint: "Снимите галочку, чтобы опубликовать" }
      - { label: "Текст статьи", name: "body", widget: "markdown" }

  # ── Туры (JSON, по файлу на тур) ──
  - name: "tours"
    label: "Туры"
    label_singular: "Тур"
    description: "Авторские этнотуры — по одному файлу на каждый."
    folder: "src/content/tours"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Slug", name: "slug", widget: "string", hint: "Только латиница и дефисы" }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Регион / подзаголовок", name: "region", widget: "string", required: false }
      - { label: "Длительность", name: "duration", widget: "string", hint: "Например: 2 дня / 1 ночь" }
      - { label: "Размер группы", name: "group", widget: "string", hint: "Например: до 8 человек", required: false }
      - { label: "Цена (₽, число)", name: "price", widget: "number", value_type: "int", min: 0 }
      - { label: "Единица цены", name: "priceUnit", widget: "string", default: "с человека", required: false }
      - { label: "Обложка", name: "cover", widget: "image", allow_unsupported: false, required: false }
      - { label: "Alt обложки", name: "coverAlt", widget: "string", required: false }
      - { label: "Краткое описание", name: "desc", widget: "text" }
      - { label: "Программа по дням", name: "program", widget: "list", summary: "{{fields.day}} — {{fields.text}}", fields: [
          { label: "День", name: "day", widget: "string", hint: "Например: День 1" },
          { label: "Описание", name: "text", widget: "text" },
        ]}

  # ── Товары (JSON) ──
  - name: "products"
    label: "Магазин · Товары"
    label_singular: "Товар"
    description: "Каталог магазина: какао, инструменты, благовония, наборы."
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Подпись / характеристика", name: "meta", widget: "string", required: false }
      - { label: "Цена (₽)", name: "price", widget: "number", value_type: "int", min: 0 }
      - { label: "Тег", name: "tag", widget: "select", required: false, options: [
          { label: "Без тега", value: "" },
          { label: "Бестселлер", value: "Бестселлер" },
          { label: "Новинка", value: "Новинка" },
          { label: "Подарок", value: "Подарок" },
        ]}
      - { label: "Обложка", name: "cover", widget: "image", allow_unsupported: false, required: false }
      - { label: "Alt обложки", name: "coverAlt", widget: "string", required: false }

  # ── Отзывы (JSON) ──
  - name: "testimonials"
    label: "Отзывы"
    label_singular: "Отзыв"
    description: "Цитаты участников — отображаются на главной."
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Цитата", name: "quote", widget: "text" }
      - { label: "Имя", name: "name", widget: "string" }
      - { label: "Мета (город · формат)", name: "meta", widget: "string", required: false }

  # ── Ближайшие события (JSON) ──
  - name: "events"
    label: "Ближайшие события"
    label_singular: "Событие"
    description: "Анонсы ближайших практик, туров и церемоний."
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Подпись", name: "meta", widget: "string", required: false, hint: "Например: Сухум · скрипка, ханг, голос" }
      - { label: "Ссылка", name: "href", widget: "string", default: "/", required: false }
      - { label: "Дата", name: "date", widget: "object", fields: [
          { label: "День", name: "day", widget: "string" },
          { label: "Месяц (3 буквы)", name: "month", widget: "string" },
          { label: "Год", name: "year", widget: "string" },
        ]}

  # ── Страницы (JSON, по файлу на страницу) ──
  - name: "pages"
    label: "Страницы"
    label_singular: "Страница"
    description: "Контент страниц сайта: meta, hero, секции. Каждая страница — отдельный JSON-файл."
    editor:
      preview: false
    files:
      - name: "home"
        label: "Главная"
        file: "src/content/pages/home.json"
        format: "json"
        fields:
          - { label: "SEO", name: "meta", widget: "object", fields: [
              { label: "Title (title)", name: "title", widget: "string" },
              { label: "Description (meta)", name: "description", widget: "text" },
            ]}
          - { label: "Hero (главный экран)", name: "hero", widget: "object", fields: [
              { label: "Надзаголовок (eyebrow)", name: "eyebrow", widget: "string", required: false },
              { label: "Заголовок", name: "title", widget: "string" },
              { label: "Подзаголовок", name: "subtitle", widget: "text", required: false },
              { label: "Lede (вводный текст для subhero)", name: "lede", widget: "text", required: false },
              { label: "Кнопки действий", name: "actions", widget: "list", required: false, fields: [
                  { label: "Текст кнопки", name: "label", widget: "string" },
                  { label: "Ссылка", name: "href", widget: "string" },
                  { label: "Primary (основная)", name: "primary", widget: "boolean", default: true },
                ]},
              { label: "Мета-информация (для hero--full)", name: "meta", widget: "list", required: false, fields: [
                  { label: "Подпись", name: "label", widget: "string" },
                  { label: "Значение", name: "value", widget: "string" },
                ]},
              { label: "Фон (изображение)", name: "bg", widget: "object", required: false, fields: [
                  { label: "Изображение", name: "src", widget: "image", allow_unsupported: false },
                  { label: "Мобильное изображение", name: "srcMobile", widget: "image", allow_unsupported: false, required: false },
                  { label: "Alt-текст изображения", name: "alt", widget: "string" },
                ]},
            ]}
          - { label: "Секции", name: "sections", widget: "list", required: false,
              summary: "{{fields.type}} — {{fields.title | default: '(без заголовка)'}}",
              fields: [
                { label: "Тип секции", name: "type", widget: "string", required: false,
                  hint: "Например: directions, stats, about-preview, events, testimonials, blog-preview, cta, about-author, values, timeline, why-abkhazia, approach, tours-list, included, split, split-reverse, process, preparation, events-static, about-practice, video, formats, products, delivery, contacts-grid, faq, blog-list" },
                { label: "Eyebrow", name: "eyebrow", widget: "string", required: false },
                { label: "Заголовок", name: "title", widget: "string", required: false },
                { label: "Вводный текст (lede)", name: "lede", widget: "text", required: false },
                { label: "Подзаголовок (subheading)", name: "subheading", widget: "string", required: false },
                { label: "Закрывающий текст", name: "closing", widget: "text", required: false },
                { label: "Служебная пометка (serviceNote)", name: "serviceNote", widget: "text", required: false },
                { label: "Изображение", name: "image", widget: "object", required: false, fields: [
                    { label: "Путь", name: "src", widget: "image", allow_unsupported: false },
                    { label: "Мобильное", name: "srcMobile", widget: "image", allow_unsupported: false, required: false },
                    { label: "Alt-текст изображения", name: "alt", widget: "string" },
                  ]},
                { label: "Постер (видео)", name: "poster", widget: "object", required: false, fields: [
                    { label: "Путь", name: "src", widget: "image", allow_unsupported: false },
                    { label: "Alt-текст изображения", name: "alt", widget: "string" },
                  ]},
                { label: "Список (dotted-list / bullets)", name: "list", widget: "list", required: false,
                    field: { label: "Пункт", name: "item", widget: "string" }},
                { label: "Абзацы", name: "paragraphs", widget: "list", required: false,
                    field: { label: "Абзац", name: "p", widget: "text" }},
                { label: "Кнопка CTA (секции)", name: "cta", widget: "object", required: false, fields: [
                    { label: "Текст", name: "label", widget: "string" },
                    { label: "Ссылка", name: "href", widget: "string" },
                  ]},
                { label: "Общие действия (actions)", name: "actions", widget: "list", required: false, fields: [
                    { label: "Текст", name: "label", widget: "string" },
                    { label: "Ссылка", name: "href", widget: "string" },
                    { label: "Primary", name: "primary", widget: "boolean", default: true },
                  ]},
                { label: "Контакты (для CTA-секции)", name: "contacts", widget: "object", required: false, fields: [
                    { label: "Подпись блока", name: "label", widget: "string", required: false },
                    { label: "Email", name: "email", widget: "string", required: false },
                    { label: "Телефон (отображение)", name: "phone", widget: "string", required: false },
                    { label: "Телефон (tel:)", name: "phoneTel", widget: "string", required: false },
                    { label: "Telegram (текст)", name: "telegram", widget: "string", required: false },
                    { label: "Telegram URL", name: "telegramUrl", widget: "string", required: false },
                  ]},
                { label: "Статистика (stats)", name: "items", widget: "list", required: false,
                    summary: "{{fields.label}} — {{fields.num}}",
                    fields: [
                      { label: "Число", name: "num", widget: "string" },
                      { label: "Подпись", name: "label", widget: "string" },
                      { label: "Нумерация (prefix/num)", name: "prefix", widget: "string", required: false },
                    ]},
                { label: "Карточки (directions, values, numbered, formats)", name: "cards", widget: "list", required: false,
                    summary: "{{fields.title}}",
                    fields: [
                      { label: "Номер / Префикс", name: "num", widget: "string", required: false },
                      { label: "Заголовок", name: "title", widget: "string" },
                      { label: "Описание", name: "desc", widget: "text", required: false },
                      { label: "Href (ссылка)", name: "href", widget: "string", required: false },
                      { label: "CTA-текст", name: "cta", widget: "string", required: false },
                    ]},
                { label: "Таймлайн (timeline)", name: "timeline", widget: "list", required: false,
                    summary: "{{fields.year}} — {{fields.title}}",
                    fields: [
                      { label: "Год", name: "year", widget: "string" },
                      { label: "Заголовок", name: "title", widget: "string" },
                      { label: "Описание", name: "desc", widget: "text" },
                    ]},
                { label: "Шаги (process)", name: "steps", widget: "list", required: false,
                    summary: "{{fields.title}}",
                    fields: [
                      { label: "Заголовок шага", name: "title", widget: "string" },
                      { label: "Описание", name: "desc", widget: "text" },
                    ]},
                { label: "Правила подготовки (list)", name: "rules", widget: "list", required: false,
                    field: { label: "Правило", name: "rule", widget: "text" }},
                { label: "Статические события (events-static)", name: "eventsStatic", widget: "list", required: false,
                    summary: "{{fields.title}}",
                    fields: [
                      { label: "Дата", name: "date", widget: "object", fields: [
                          { label: "День", name: "day", widget: "string" },
                          { label: "Месяц", name: "month", widget: "string" },
                        ]},
                      { label: "Заголовок", name: "title", widget: "string" },
                      { label: "Meta (длительность, локация)", name: "meta", widget: "string", required: false },
                      { label: "Ссылка", name: "href", widget: "string", required: false },
                    ]},
                { label: "Блок контактов (contacts-grid)", name: "contactsBlock", widget: "object", required: false, fields: [
                    { label: "Eyebrow", name: "eyebrow", widget: "string", required: false },
                    { label: "Заголовок", name: "title", widget: "string" },
                    { label: "Список контактов", name: "items", widget: "list", fields: [
                        { label: "Подпись", name: "label", widget: "string" },
                        { label: "Значение", name: "value", widget: "string" },
                        { label: "Ссылка (href)", name: "href", widget: "string", required: false },
                        { label: "Примечание", name: "note", widget: "text", required: false },
                      ]},
                  ]},
                { label: "Форма (contacts-grid → form)", name: "form", widget: "object", required: false, fields: [
                    { label: "Eyebrow", name: "eyebrow", widget: "string", required: false },
                    { label: "Заголовок", name: "title", widget: "string" },
                    { label: "Вводный текст", name: "lede", widget: "text", required: false },
                    { label: "Поля формы", name: "fields", widget: "list", required: false, fields: [
                        { label: "Подпись / Текст", name: "label", widget: "string" },
                        { label: "Name", name: "name", widget: "string" },
                        { label: "Тип", name: "type", widget: "select", options: ["text", "textarea", "select"] },
                        { label: "Placeholder", name: "placeholder", widget: "string", required: false },
                        { label: "Обязательное", name: "required", widget: "boolean", default: true },
                        { label: "Строк (textarea)", name: "rows", widget: "number", value_type: "int", required: false },
                        { label: "Опции (select)", name: "options", widget: "list", required: false, fields: [
                            { label: "Подпись / Текст", name: "label", widget: "string" },
                            { label: "Value", name: "value", widget: "string" },
                          ]},
                      ]},
                    { label: "Согласие", name: "agreement", widget: "text", required: false },
                    { label: "Текст кнопки", name: "submitLabel", widget: "string" },
                  ]},
                { label: "FAQ", name: "faq", widget: "list", required: false,
                    summary: "{{fields.question}}",
                    fields: [
                      { label: "Вопрос", name: "question", widget: "text" },
                      { label: "Ответ", name: "answer", widget: "text" },
                    ]},
                { label: "Статьи блога (blog-list)", name: "blogItems", widget: "list", required: false,
                    summary: "{{fields.title}}",
                    fields: [
                      { label: "Slug", name: "slug", widget: "string" },
                      { label: "Тег", name: "tag", widget: "string", required: false },
                      { label: "Дата (ISO)", name: "date", widget: "string" },
                      { label: "Дата (отображение)", name: "dateDisplay", widget: "string", required: false },
                      { label: "Время чтения", name: "readTime", widget: "string", required: false },
                      { label: "Заголовок", name: "title", widget: "string" },
                      { label: "Описание (excerpt)", name: "desc", widget: "text", required: false },
                      { label: "Обложка", name: "cover", widget: "object", required: false, fields: [
                          { label: "Путь", name: "src", widget: "image", allow_unsupported: false },
                          { label: "Alt-текст изображения", name: "alt", widget: "string" },
                        ]},
                    ]},
              ]}

      - name: "about"
        label: "О нас"
        file: "src/content/pages/about.json"
        format: "json"
        fields:
          - { label: "SEO", name: "meta", widget: "object", fields: [
              { label: "Title (title)", name: "title", widget: "string" },
              { label: "Description (meta)", name: "description", widget: "text" },
            ]}
          - { label: "Hero (subhero)", name: "hero", widget: "object", fields: [
              { label: "Надзаголовок (eyebrow)", name: "eyebrow", widget: "string", required: false },
              { label: "Заголовок", name: "title", widget: "string" },
              { label: "Lede (вводный текст)", name: "lede", widget: "text", required: false },
            ]}
          - { label: "Секции", name: "sections", widget: "list", required: false,
              summary: "{{fields.type}} — {{fields.title | default: '(без заголовка)'}}",
              fields: [
                { label: "Тип секции", name: "type", widget: "string", required: false },
                { label: "Eyebrow", name: "eyebrow", widget: "string", required: false },
                { label: "Заголовок", name: "title", widget: "string", required: false },
                { label: "Lede", name: "lede", widget: "text", required: false },
                { label: "Subheading", name: "subheading", widget: "string", required: false },
                { label: "Lede (краткое описание)", name: "ledeText", widget: "text", required: false },
                { label: "Закрывающий текст", name: "closing", widget: "text", required: false },
                { label: "Service note", name: "serviceNote", widget: "text", required: false },
                { label: "Изображение", name: "image", widget: "object", required: false, fields: [
                    { label: "Путь", name: "src", widget: "image", allow_unsupported: false },
                    { label: "Мобильное", name: "srcMobile", widget: "image", allow_unsupported: false, required: false },
                    { label: "Alt-текст изображения", name: "alt", widget: "string" },
                  ]},
                { label: "Постер", name: "poster", widget: "object", required: false, fields: [
                    { label: "Путь", name: "src", widget: "image", allow_unsupported: false },
