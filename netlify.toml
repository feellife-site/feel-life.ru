# Netlify — конфигурация деплоя для feel-life.ru
# Документация: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ───────── Identity (логин для Decap CMS) ─────────
# После первого деплоя зайди в Netlify → Site settings → Identity → Enable
# Затем в разделе Identity → Services → Enable Git Gateway
# После этого открой https://feel-life.ru/admin/ и нажми "Login with Netlify Identity"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/images/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Редирект www → apex (опционально — раскомментируй если нужно)
